<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Schedule</title>
  <link rel="stylesheet" href="styles/encapsulation.css">
</head>
<body>

  <h1>JavaScript Objects</h1>

  <table id="sections">
    <caption id="courseName"></caption>
    <thead>
      <tr>
        <th>Section</th>
        <th>Enrollment</th>
        <th>Instructor</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="actions">
    <label for="sectionNumber">Section Number:</label>
    <input type="text" id="sectionNumber" placeholder="e.g., 001">
    <button id="enrollStudent">Enroll Student</button>
    <button id="dropStudent">Drop Student</button>
  </div>

  <script src="scripts/encapsulation.js" defer></script>
</body>
</html>
