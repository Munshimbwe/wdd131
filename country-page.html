<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabwe Explorer</title>
    <link rel="stylesheet" href="styles/country-page.css">
</head>
<body>

    <div class="dashboard-container">
        
        <header>
            <h1 id="country-title">Country</h1>
        </header>

        <div class="main-content">
            <img class="background-hero" id="bg-image" src="" alt="Location Backdrop">

            <div class="floating-card">
                <div class="card-header">Data</div>
                <div class="info-list" id="data-container"></div>
            </div>

            <div class="floating-card">
                <div class="card-header">
                    <span>Weather ⛅</span>
                    <img class="weather-icon" id="weather-icon" src=" alt="">
                </div>
                <div class="info-list" id="weather-container"></div>
            </div>
        </div>

        <footer>
            <div id="footer-text">©2026 - Munshimbwe Kafwanka - Kabwe, Zambia</div>
            <div id="footer-date">Last Modification: --/--/---- --:--:--</div>
        </footer>

    </div>

    <script src="scripts/country-page.js"></script>
</body>
</html>
