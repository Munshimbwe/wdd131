<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A confirmation page for product review submissions in WDD 131, displaying total reviews submitted and last modification date.">
    <title>Review Submitted Successfully</title>
    <link rel="stylesheet" href="styles/form.css">
    <script type="module" src="scripts/main.js"></script>
</head>
<body>

    <header>
        <h1>Review Confirmation</h1>
    </header>

    <main class="confirmation-main">
        <div class="form-card">
            <h2 class="success-title">🎉 Submission Successful!</h2>
            <p>Thank you for submitting your product rating layout evaluation data.</p>
            <div class="counter-box">
                <p class="counter-text">Total Reviews Completed: <span id="reviewCounterDisplay">0</span></p>
            </div>
            <a href="form.html" class="btn-submit confirmation-btn">Submit Another Review</a>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Munshimbwe Kafwanka - WDD 131 | ⚒️ Kabwe, Zambia ⚒️</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
